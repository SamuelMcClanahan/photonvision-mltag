apply plugin: 'org.photonvision.tools.WpilibTools'

import java.nio.file.Path
import java.util.Locale

ext.licenseFile = file("$rootDir/LICENSE")
ext.externalLicensesFolder = file("$rootDir/ExternalLicenses")
apply from: "${rootDir}/shared/common.gradle"

wpilibTools.deps.wpilibVersion = wpilibVersion

def nativeConfigName = 'wpilibNatives'
configurations {
    wpilibNatives
}
def nativeTasks = wpilibTools.createExtractionTasks {
    configurationName = nativeConfigName
}

if (System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("mac")) {
    nativeTasks.fixup.configure { fixupTask ->
        // The upstream task runs `strip -x -S` on every copied native library.
        // Apple's strip can fail on fat OpenCV dylibs even though otool and codesign can
        // still process them correctly, so keep the install-name fixups but make strip
        // best-effort on macOS.
        fixupTask.actions.clear()
        fixupTask.doLast {
            def inputDir = fixupTask.getInputDirectory().get().asFile
            def outputDir = fixupTask.getOutputDirectory().get().asFile

            project.sync {
                from inputDir
                into outputDir
            }

            def runCommand = { List<String> command, boolean ignoreExitValue ->
                def commandStrings = command.collect { it.toString() }
                def outputBytes = new ByteArrayOutputStream()
                def process = new ProcessBuilder(commandStrings)
                        .redirectErrorStream(true)
                        .start()
                process.inputStream.transferTo(outputBytes)
                def exitValue = process.waitFor()

                if (exitValue != 0 && !ignoreExitValue) {
                    throw new GradleException("Command failed (${exitValue}): ${commandStrings.join(' ')}\n${outputBytes}")
                }

                [exitValue: exitValue, output: outputBytes.toString()]
            }

            fileTree(outputDir).files.findAll { it.isFile() }.each { nativeFile ->
                def stripResult = runCommand(["strip", "-x", "-S", nativeFile.absolutePath], true)

                if (stripResult.exitValue != 0) {
                    fixupTask.logger.info("Continuing after strip failed for ${nativeFile.name}")
                }

                def otoolResult = runCommand(["otool", "-L", nativeFile.absolutePath], true)

                if (otoolResult.exitValue != 0) {
                    fixupTask.logger.info("Skipping install-name and codesign fixups for ${nativeFile.name}")
                    return
                }

                def dependencies = new LinkedHashSet<String>()
                otoolResult.output.eachLine { line ->
                    def trimmed = line.trim()
                    if (!trimmed
                            || trimmed.contains(nativeFile.name)
                            || trimmed.startsWith("/")
                            || trimmed.endsWith(":")) {
                        return
                    }

                    dependencies.add(trimmed.split(/\s+/)[0])
                }

                dependencies.each { dependency ->
                    def loaderPathDependency = dependency.startsWith("@rpath/")
                            ? dependency.substring("@rpath/".length())
                            : dependency

                    runCommand(["install_name_tool", "-change",
                                dependency,
                                "@loader_path/${loaderPathDependency}",
                                nativeFile.absolutePath], false)
                }

                runCommand(["codesign", "--force", "--sign", "-", nativeFile.absolutePath], false)
            }
        }
    }
}

nativeTasks.addToSourceSetResources(sourceSets.main)

def photonTargetingNativePlatformPaths = [
    linuxarm64: [resourcePath: "linux/arm64", sharedExt: "so"],
    osxuniversal: [resourcePath: "osx/universal", sharedExt: "dylib"],
]

def photonTargetingNativeInfo = photonTargetingNativePlatformPaths[jniPlatform]
if (photonTargetingNativeInfo != null) {
    def photonTargetingTaskSuffix = jniPlatform.capitalize()
    def photonTargetingProject = project(":photon-targeting")
    def copyPhotonTargetingNatives = tasks.register("copyPhotonTargetingNativesMain", Copy) {
        dependsOn nativeTasks.fixup
        dependsOn ":photon-targeting:photontargeting${photonTargetingTaskSuffix}ReleaseSharedLibrary"
        dependsOn ":photon-targeting:photontargetingJNI${photonTargetingTaskSuffix}ReleaseSharedLibrary"

        def sharedExt = photonTargetingNativeInfo.sharedExt
        from(photonTargetingProject.layout.buildDirectory.file("libs/photontargeting/shared/${jniPlatform}/release/libphotontargeting.${sharedExt}"))
        from(photonTargetingProject.layout.buildDirectory.file("libs/photontargetingJNI/shared/${jniPlatform}/release/libphotontargetingJNI.${sharedExt}"))
        into(layout.buildDirectory.dir("NativeMain/RuntimeLibs/${photonTargetingNativeInfo.resourcePath}/shared"))
    }

    nativeTasks.hash.configure {
        dependsOn copyPhotonTargetingNatives
    }
}

dependencies {
    wpilibNatives wpilibTools.deps.wpilib("wpimath")
    wpilibNatives wpilibTools.deps.wpilib("wpinet")
    wpilibNatives wpilibTools.deps.wpilib("wpiutil")
    wpilibNatives wpilibTools.deps.wpilib("datalog")
    wpilibNatives wpilibTools.deps.wpilib("ntcore")
    wpilibNatives wpilibTools.deps.wpilib("cscore")
    wpilibNatives wpilibTools.deps.wpilib("apriltag")
    wpilibNatives wpilibTools.deps.wpilib("hal")
    wpilibNatives wpilibTools.deps.wpilibOpenCv("frc" + openCVYear, openCVversion)

    // These stay as implementation dependencies since they don't have native code that gets packaged
    implementation 'org.zeroturnaround:zt-zip:1.14'
    implementation "org.xerial:sqlite-jdbc:3.41.0.0"
    implementation 'com.diozero:diozero-core:1.4.1'
    implementation 'com.github.oshi:oshi-core:6.9.1'

    // The JNI libraries use wpilibNatives, the java libraries use implementation
    if (jniPlatform == "linuxarm64") {
        wpilibNatives("org.photonvision:rknn_jni-jni:$rknnVersion:$jniPlatform") {
            transitive = false
        }
        wpilibNatives("org.photonvision:rubik_jni-jni:$rubikVersion:$jniPlatform") {
            transitive = false
        }
        wpilibNatives("org.photonvision:photon-libcamera-gl-driver-jni:$libcameraDriverVersion:$jniPlatform") {
            transitive = false
        }
    }

    implementation("org.photonvision:rknn_jni-java:$rknnVersion") {
        transitive = false
    }

    implementation("org.photonvision:rubik_jni-java:$rubikVersion") {
        transitive = false
    }

    implementation "org.photonvision:photon-libcamera-gl-driver-java:$libcameraDriverVersion"

    implementation "org.photonvision:photon-mrcal-java:$mrcalVersion"

    wpilibNatives("org.photonvision:photon-mrcal-jni:$mrcalVersion:$jniPlatform") {
        transitive = false
    }

    testImplementation group: 'org.junit-pioneer' , name: 'junit-pioneer', version: '2.2.0'
}

task writeCurrentVersion {
    doLast {
        def versionFileIn = file("${rootDir}/shared/PhotonVersion.java.in")
        writePhotonVersionFile(versionFileIn, Path.of("$buildDir", "generated", "java", "org", "photonvision", "PhotonVersion.java"),
                versionString)
    }
}
// https://github.com/wpilibsuite/allwpilib/blob/main/wpilibj/build.gradle#L52
sourceSets.main.java.srcDir "${buildDir}/generated/java/"

compileJava.dependsOn writeCurrentVersion
